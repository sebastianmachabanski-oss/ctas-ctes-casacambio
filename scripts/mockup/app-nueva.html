<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="app.css">
<style>
  html, body { background: var(--page); }
  /* Barra de estado del sistema operativo (no es parte de la app) */
  .os-bar {
    height: 54px; display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 26px 8px; background: var(--card);
    font: 600 15px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); letter-spacing: .2px;
  }
  .os-bar .der { display: flex; align-items: center; gap: 6px; }
  .cc-topbar { padding-top: 10px; padding-bottom: 10px; }
  /* En una imagen de producto las barras de scroll son ruido visual */
  *::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }
  main { padding-bottom: 34px; }
</style>
</head>
<body>

<div class="os-bar">
  <span>9:41</span>
  <span class="der">
    <!-- señal -->
    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
      <rect x="0"  y="8" width="3" height="4" rx="1"/>
      <rect x="5"  y="6" width="3" height="6" rx="1"/>
      <rect x="10" y="3" width="3" height="9" rx="1"/>
      <rect x="15" y="0" width="3" height="12" rx="1"/>
    </svg>
    <!-- wifi -->
    <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
      <path d="M8 11.2 5.8 8.6a3.4 3.4 0 0 1 4.4 0L8 11.2Z"/>
      <path d="M3.6 6.3a6.6 6.6 0 0 1 8.8 0l-1.3 1.5a4.7 4.7 0 0 0-6.2 0L3.6 6.3Z"/>
      <path d="M1.2 3.7a10 10 0 0 1 13.6 0l-1.3 1.5a8.1 8.1 0 0 0-11 0L1.2 3.7Z"/>
    </svg>
    <!-- batería -->
    <svg width="26" height="13" viewBox="0 0 26 13">
      <rect x="0.5" y="0.5" width="21" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-opacity=".38"/>
      <rect x="2" y="2" width="16" height="9" rx="2" fill="currentColor"/>
      <path d="M23 4.4v4.2a2.6 2.6 0 0 0 0-4.2Z" fill="currentColor" fill-opacity=".45"/>
    </svg>
  </span>
</div>

<header class="cc-topbar">
  <button class="cc-hamb" aria-label="Menú">☰</button>
  <div>
    <div class="cc-crumb">Casa de Cambio</div>
    <div class="cc-ptitle">Nueva transacción</div>
  </div>
  <span class="cc-pill"><span class="d"></span><span class="t">Sincronizado</span></span>
</header>

<main>
<div class="p-4 md:p-6" style="display:grid;grid-template-columns:minmax(0, 1fr);gap:14px">
  <div class="card" style="padding:16px;display:grid;gap:14px">
    <div class="form-grid">
      <div><label class="label">Tipo</label><select class="input"><option>CAJA</option></select></div>
      <div><label class="label">Fecha</label><input class="input" type="text" value="06/08/2026"></div>
      <div><label class="label">Operación</label><select class="input"><option>COMPRA</option></select></div>
      <div><label class="label">Cliente</label><input class="input" type="text" value="MARTÍNEZ, LUIS"></div>
      <div><label class="label">Moneda propia</label><select class="input"><option>DOLARES</option></select></div>
      <div><label class="label">Moneda externa</label><select class="input"><option>PESOS</option></select></div>
      <div><label class="label">Monto</label><input class="input" type="text" value="12.500,00"></div>
      <div><label class="label">Cotización</label><input class="input" type="text" value="1.196,50"></div>
    </div>
    <div class="banner banner-info">
      El importe supera el umbral configurado: confirmá antes de guardar.
    </div>
    <button class="btn-primary" style="width:100%;padding:12px">Guardar transacción</button>
  </div>
</div>
</main>

</body></html>
